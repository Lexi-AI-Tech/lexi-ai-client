name: Build & Sign macOS App

# Disabled: no automatic trigger. Uncomment below to run on tag push, or run manually from Actions tab.
on:
  workflow_dispatch:
#  push:
#    tags:
#      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # 🔐 Import Apple Certificate Properly (FIXED VERSION)
      - name: Import Apple Certificate
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          # Create temporary keychain
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          # Import certificate
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          # Allow codesign to access key without UI prompt (CRITICAL FIX)
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k temp build.keychain

          # Make keychain available
          security list-keychains -d user -s build.keychain

        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # 🚀 Build & Sign Tauri App
      - name: Build Tauri App
        run: npm run tauri build
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
