# Production release: push to main (or workflow_dispatch) → GitHub release + upload to prod server.
name: Release Lexi AI Client (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if tag already exists (fail fast, once per release)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking if tag v$VERSION already exists on remote..."
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "❌ Error: Tag v$VERSION already exists! Please bump the version to trigger a new release."
            exit 1
          fi
          echo "✅ Version v$VERSION is new. Proceeding..."

  build-and-release-prod:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Targets for Universal Build
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Import Apple Certificate
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temp-build-keychain}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security find-identity -v -p codesigning build.keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Check version match
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep '^version =' src-tauri/Cargo.toml | head -n 1 | awk -F '"' '{print $2}')
          if [ "$PKG_VERSION" != "$TAURI_VERSION" ] || [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Version mismatch! package.json: $PKG_VERSION tauri: $TAURI_VERSION cargo: $CARGO_VERSION"
            exit 1
          fi
          echo "✅ Versions match: $PKG_VERSION"

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version $VERSION"

      - name: Read Release Notes
        id: read_changelog
        run: |
          CHANGELOG_PATH="changelog/${{ env.VERSION }}.md"
          if [ -f "$CHANGELOG_PATH" ]; then
            echo "Found changelog at $CHANGELOG_PATH"
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "RELEASE_NOTES<<$EOF" >> $GITHUB_ENV
            cat "$CHANGELOG_PATH" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
            echo "$EOF" >> $GITHUB_ENV
          else
            echo "❌ Error: No changelog found for version ${{ env.VERSION }} at $CHANGELOG_PATH"
            exit 1
          fi

      - name: Build Tauri App and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: "Lexi AI v${{ env.VERSION }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          # Explicitly enable the prod feature flag for the Rust app.
          # First `--` separates tauri args from cargo args.
          args: --target ${{ matrix.target }} -- --features custom-protocol

      - name: Publish update manifest to Lexi AI Prod Server
        if: success() && matrix.os == 'macos-latest'
        env:
          UPDATE_POST_URL: "https://server.speaklexi.com/api/v1/updates"
          APP_RELEASES_API_KEY: ${{ secrets.APP_RELEASES_API_KEY }}
        run: |
          VERSION="${{ env.VERSION }}"
          TARGET="darwin"
          BUNDLE_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Lexi AI.app.tar.gz"
          DMG_ORIGINAL="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Lexi AI_${VERSION}_universal.dmg"
          DMG_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/LexiAI-Installer.dmg"
          cp "$DMG_ORIGINAL" "$DMG_PATH"
          SIG_CONTENT=$(cat "$BUNDLE_PATH.sig")
          echo "Uploading to production server..."
          curl -X POST "$UPDATE_POST_URL" \
               -H "X-API-Key: $APP_RELEASES_API_KEY" \
               -F "version=$VERSION" \
               -F "target=$TARGET" \
               -F "notes=$RELEASE_NOTES" \
               -F "updater_signature=$SIG_CONTENT" \
               -F "updater_file=@$BUNDLE_PATH" \
               -F "installer_file=@$DMG_PATH" \
               --fail --show-error
          echo "Successfully uploaded to Lexi AI Production Server!"

      - name: Publish update manifest to Lexi AI Prod Server (Windows)
        if: success() && matrix.os == 'windows-latest'
        env:
          UPDATE_POST_URL: "https://server.speaklexi.com/api/v1/updates"
          APP_RELEASES_API_KEY: ${{ secrets.APP_RELEASES_API_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          TARGET="windows"
          NSIS_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          shopt -s nullglob
          setups=("$NSIS_DIR"/*-setup.exe)
          if [ ${#setups[@]} -eq 0 ]; then
            echo "❌ No NSIS *-setup.exe under $NSIS_DIR"
            ls -la "$NSIS_DIR" || true
            exit 1
          fi
          SETUP_EXE="${setups[0]}"
          SIG_FILE="$SETUP_EXE.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "❌ Missing updater signature: $SIG_FILE"
            exit 1
          fi
          INSTALLER_PATH="$NSIS_DIR/LexiAI-Setup.exe"
          cp "$SETUP_EXE" "$INSTALLER_PATH"
          SIG_CONTENT=$(cat "$SIG_FILE")
          echo "Uploading Windows release to production server..."
          curl -X POST "$UPDATE_POST_URL" \
               -H "X-API-Key: $APP_RELEASES_API_KEY" \
               -F "version=$VERSION" \
               -F "target=$TARGET" \
               -F "notes=$RELEASE_NOTES" \
               -F "updater_signature=$SIG_CONTENT" \
               -F "updater_file=@$SETUP_EXE" \
               -F "installer_file=@$INSTALLER_PATH" \
               --fail --show-error
          echo "Successfully uploaded Windows build to Lexi AI Production Server!"
