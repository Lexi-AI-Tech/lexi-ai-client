name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security vulnerabilities, **do not** use this form; see SECURITY.md in the repository root.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press the hotkey ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.1.11
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.1, Windows 11 23H2
  - type: dropdown
    id: build
    attributes:
      label: How did you run the app?
      options:
        - Installed release
        - Built from source (npm run build)
        - Development (npm run dev)
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant logs (see "Run the Built App with Logs" in the README) or attach screenshots. Remove any personal or sensitive information.
      render: shell
