[package]
name = "lexi-ai"
version = "0.1.0"
description = "Speech-to-text overlay app for macOS"
authors = ["anadi45"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.0", features = [ "devtools", "tray-icon"] }
tauri-plugin-store = "2.0"
tauri-plugin-single-instance = "2"
tauri-plugin-devtools = "2.0"
tauri-plugin-deep-link = "2.0"
tauri-plugin-autostart = "2.0"

hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2.1"
cpal = "0.15"
reqwest = { version = "0.11", features = ["json", "multipart"] }
hound = "3.5" # For WAV encoding
chrono = "0.4"
cocoa = "0.24"
objc = "0.2"
rdev = { git = "https://github.com/fufesou/rdev" }  # Fork fixes macOS issues
arboard = "3.4"  # Cross-platform clipboard
enigo = "0.6.1"    # Cross-platform input simulation
uuid = { version = "1.0", features = ["v4"] }
keyring = "2.3"  # OS keychain/credential manager for secure token storage
tempfile = "3.8"  # Temporary file handling for TTS audio
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel" }  # macOS NSPanel for advanced window behaviors
tauri-plugin-macos-input-monitor = "0.1"  # CGEventTap: suppress system shortcuts (e.g. Fn → emoji picker)
macos-accessibility-client = "0.0"
