[package]
name = "lexi-ai"
version = "0.1.5"
description = "AI Productivity tool"
authors = ["anadi45"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.10.2", features = [ "devtools", "tray-icon"] }
tauri-plugin-store = "2.4.2"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-autostart = "2.5.1"

hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2.1"
cpal = "0.15"
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
hound = "3.5" # For WAV encoding
chrono = "0.4"
cocoa = "0.24"
objc = "0.2"
# Native macOS event listener
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
lazy_static = "1.4.0"
arboard = "3.4"  # Cross-platform clipboard
active-win-pos-rs = "0.9"  # Active window / frontmost app
enigo = "0.6.1"    # Cross-platform input simulation
uuid = { version = "1.0", features = ["v4"] }
keyring = "2.3"  # OS keychain/credential manager for secure token storage
tempfile = "3.8"  # Temporary file handling for TTS audio
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-http = "2.5.7"
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel" }  # macOS NSPanel for advanced window behaviors
macos-accessibility-client = "0.0"
objc2-foundation = "0.3.2"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }  # meeting system audio (process tap)
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSRunningApplication", "NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep"] }
plist = "1.7"
sysinfo = "0.38.0"
